- conversation_group_id: List metrics + OOM
  turns:
  - turn_id: List firing alerts
    query: List the firing alerts in the cluster
    contexts:
      - "The ALERTS are built-in prometheus metrics that can be accessed using the obs-mcp tool" 
      - "The firing alerts should point to some KubePodCrashLooping for the awesome-application pods"
      - "The suffix of the pod is variable, depending on the deployment"
      - "Other alerts may be mentioned as well but it is important that at least a CrashLoopBackOff points to awesome-application-*"
    expected_response: |
      Currently firing alerts (from ALERTS{alertstate="firing"}): 
      KubePodCrashLooping (severity=warning) — pod awesome-application-*, container app, namespace openshift-cluster-observability-operator (CrashLoopBackOff)

    expected_tool_calls:
      - - tool_name: execute_instant_query
          arguments:
            query: "ALERTS{alertstate=\"firing\"}"

  - turn_id: Investigate OOM
    query: Investigate the KubePodCrashLooping
    contexts:
      - "The awesome-application is in CrashLoopBackOff due to OOM kill"
      - "The awesome-application is in out of memory due a memory leakage in the deployment command"
    expected_response: |
      Root cause: the app container is being OOMKilled due to a deliberate memory leak in the pod command, while the container has a 60Mi memory limit. Deployment awesome-application runs Python that appends ~1MB/sec forever.

    expected_tool_calls:
      - - tool_name: pods_log
        - tool_name: pods_get
        - tool_name: events_list
          arguments:
            namespace: namespace=openshift-cluster-observability-operator
        - tool_name: resources_get
          arguments:
            apiVersion: apps/v1
            kind: Deployment
            name: awesome-application
            namespace: openshift-cluster-observability-operator
